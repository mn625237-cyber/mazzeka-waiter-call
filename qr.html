<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mazzeka — طباعة QR</title><link rel="icon" href="assets/mazzeka-logo.png"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;700;800&display=swap" rel="stylesheet"><style>:root{--red:#ff1738;--bg:#060607}*{box-sizing:border-box}body{margin:0;background:#111;color:#fff;font-family:Cairo,sans-serif}.toolbar{position:sticky;top:0;z-index:2;background:#09090a;padding:14px;display:flex;gap:10px;align-items:center;justify-content:center}.toolbar button{border:0;border-radius:10px;padding:10px 18px;font:inherit;font-weight:700;cursor:pointer}.print{background:#ff1738;color:#fff}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;padding:20px;max-width:1200px;margin:auto}.card{background:#050506;border:1px solid #282327;border-radius:16px;padding:18px;text-align:center;break-inside:avoid}.logo{width:160px;max-width:100%;filter:drop-shadow(0 0 8px rgba(255,23,56,.4));mix-blend-mode:screen}.qr{margin:14px auto;width:180px;height:180px}.num{font-size:30px;font-weight:800}.hint{font-size:11px;color:#999;margin-top:2px}@media(max-width:900px){.grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:520px){.grid{grid-template-columns:1fr}}@media print{body{background:#fff;color:#000}.toolbar{display:none}.grid{grid-template-columns:repeat(3,1fr);gap:8mm;padding:8mm}.card{background:#fff;color:#000;border:1px solid #bbb}.hint{color:#555}.logo{filter:none}.qr{width:42mm;height:42mm}}
</style></head><body><div class="toolbar"><strong>Mazzeka · QR الترابيزات</strong><button class="print" onclick="window.print()">🖨️ طباعة</button></div><main class="grid" id="grid"></main><script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script><script type="module">import {APP_CONFIG} from './config.js';const base=new URL('./',location.href);const grid=document.getElementById('grid');for(let n=1;n<=APP_CONFIG.maxTables;n++){const card=document.createElement('article');card.className='card';const logo=document.createElement('img');logo.className='logo';logo.src='assets/mazzeka-logo.png';logo.alt='Mazzeka';const qr=document.createElement('div');qr.className='qr';const num=document.createElement('div');num.className='num';num.textContent=`ترابيزة ${n}`;const hint=document.createElement('div');hint.className='hint';hint.textContent='امسح QR لطلب الويتر';card.append(logo,qr,num,hint);grid.appendChild(card);new QRCode(qr,{text:new URL(`index.html?table=${n}`,base).href,width:180,height:180,colorDark:'#111111',colorLight:'#ffffff',correctLevel:QRCode.CorrectLevel.M})}</script></body></html>
